services:
  - type: web
    name: reelseries-cast-converter
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: smart-tv-c175a
      - key: XTREAM_ALLOWED_HOSTS
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://reelseries-cast-converter.onrender.com
